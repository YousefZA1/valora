<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="color-scheme" content="light">
  <title>Valora Bags | Premium Women Handbags Jordan</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Discover Valora Bags, a premium Jordan-based luxury handbag brand. Shop elegant crossbody bags, totes, and handbags with cash on delivery across Jordan and simple WhatsApp ordering.">
  <meta name="keywords" content="handbags Jordan, luxury bags Amman, women bags Jordan, Valora Bags, tote bags Jordan, crossbody bags Jordan">
  <meta name="author" content="Valora Bags">
  
  <!-- Google Fonts: Playfair Display (Luxury Serif) & Jost (Elegant Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->

  <link rel="stylesheet" href="css/responsive.css?v=1.2">

  <!-- Global Error Logger for Debugging -->
  <script>
    window.addEventListener('error', function(e) {
      const errDiv = document.createElement('div');
      errDiv.id = 'global-debug-error';
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#8b0000;color:white;padding:16px;z-index:99999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 4px 10px rgba(0,0,0,0.5);border-bottom:3px solid #C9A24A;text-align:left;';
      errDiv.innerHTML = '<strong style="color:#C9A24A;">[JavaScript Error]</strong> ' + e.message + '<br><small>File: ' + e.filename + ' | Line: ' + e.lineno + ' | Col: ' + e.colno + '</small>';
      document.body.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const errDiv = document.createElement('div');
      errDiv.id = 'global-debug-error';
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#8b0000;color:white;padding:16px;z-index:99999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 4px 10px rgba(0,0,0,0.5);border-bottom:3px solid #C9A24A;text-align:left;';
      errDiv.innerHTML = '<strong style="color:#C9A24A;">[Promise Rejection]</strong> ' + e.reason;
      document.body.appendChild(errDiv);
    });
  </script>
</head>

  <main id="app-view-root" class="main-content"></main>

  <!-- App Initialization ES6 Module -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
